<!DOCTYPE html>
<html lang="en" data-theme="neon">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jai Jain — Growth Marketer</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800;900&family=Cabinet+Grotesk:wght@400;500;700&display=swap"
        rel="stylesheet" />
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        /* ── THEME TOKENS ── */
        [data-theme="neon"] {
            --bg: #08080f;
            --bg2: #0f0f1a;
            --surface: rgba(255, 255, 255, 0.04);
            --border: rgba(255, 255, 255, 0.08);
            --text: #ffffff;
            --sub: rgba(255, 255, 255, 0.5);
            --a: #ff2cf5;
            --b: #00ffe7;
            --c: #ffb800;
            --blob1: rgba(255, 44, 245, 0.2);
            --blob2: rgba(0, 255, 231, 0.15);
            --blob3: rgba(255, 184, 0, 0.12);
            --shadow: rgba(255, 44, 245, 0.25);
        }

        [data-theme="dark"] {
            --bg: #0d0d0d;
            --bg2: #141414;
            --surface: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.1);
            --text: #f0f0f0;
            --sub: rgba(255, 255, 255, 0.45);
            --a: #ff6b35;
            --b: #4ecdc4;
            --c: #ffe66d;
            --blob1: rgba(255, 107, 53, 0.15);
            --blob2: rgba(78, 205, 196, 0.12);
            --blob3: rgba(255, 230, 109, 0.1);
            --shadow: rgba(255, 107, 53, 0.2);
        }

        [data-theme="light"] {
            --bg: #f5f4f0;
            --bg2: #eceae4;
            --surface: rgba(0, 0, 0, 0.05);
            --border: rgba(0, 0, 0, 0.1);
            --text: #111111;
            --sub: rgba(0, 0, 0, 0.5);
            --a: #e8175d;
            --b: #0057ff;
            --c: #ff8c00;
            --blob1: rgba(232, 23, 93, 0.12);
            --blob2: rgba(0, 87, 255, 0.1);
            --blob3: rgba(255, 140, 0, 0.1);
            --shadow: rgba(232, 23, 93, 0.2);
        }

        html,
        body {
            min-height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: 'Cabinet Grotesk', sans-serif;
            overflow-x: hidden;
            transition: background 0.4s, color 0.4s;
            cursor: none
        }

        /* ── CUSTOM CURSOR ── */
        #cursor {
            position: fixed;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--a);
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            transition: width 0.2s, height 0.2s, background 0.2s;
            mix-blend-mode: screen
        }

        #cursor-ring {
            position: fixed;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 1.5px solid var(--a);
            pointer-events: none;
            z-index: 9998;
            transform: translate(-50%, -50%);
            transition: width 0.3s, height 0.3s, border-color 0.3s, opacity 0.3s;
            opacity: 0.5
        }

        /* ── CURSOR TRAIL ── */
        .trail {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            z-index: 9990;
            mix-blend-mode: screen;
            transform: translate(-50%, -50%)
        }

        /* ── BG BLOBS ── */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 70% 50% at 15% 15%, var(--blob1) 0%, transparent 65%),
                radial-gradient(ellipse 60% 50% at 85% 25%, var(--blob2) 0%, transparent 65%),
                radial-gradient(ellipse 60% 55% at 50% 85%, var(--blob3) 0%, transparent 65%);
            pointer-events: none;
            z-index: 0;
            transition: all 0.6s
        }

        /* Noise */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            opacity: 0.03;
            pointer-events: none;
            z-index: 1
        }

        /* ── GRID LINES (neon only) ── */
        .grid-lines {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s
        }

        [data-theme="neon"] .grid-lines {
            opacity: 1
        }

        .grid-lines svg {
            width: 100%;
            height: 100%
        }

        /* ── THEME TOGGLE ── */
        .theme-bar {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
            display: flex;
            gap: 6px;
            background: var(--surface);
            border: 1px solid var(--border);
            backdrop-filter: blur(16px);
            border-radius: 50px;
            padding: 5px
        }

        .theme-btn {
            border: none;
            background: none;
            color: var(--sub);
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            padding: 5px 12px;
            border-radius: 40px;
            cursor: none;
            transition: all 0.2s;
            text-transform: uppercase
        }

        .theme-btn.active {
            background: var(--a);
            color: #fff;
            box-shadow: 0 0 12px var(--shadow)
        }

        /* ── PAGE ── */
        .page {
            position: relative;
            z-index: 2;
            max-width: 480px;
            margin: 0 auto;
            padding: 60px 20px 80px;
            display: flex;
            flex-direction: column;
            align-items: center
        }

        /* ── AVATAR ── */
        .avatar-wrap {
            margin-bottom: 18px;
            animation: fadeDown 0.7s ease both
        }

        .avatar-ring {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            padding: 3px;
            background: linear-gradient(135deg, var(--a), var(--b), var(--c));
            background-size: 300% 300%;
            animation: gradSpin 3s linear infinite
        }

        @keyframes gradSpin {
            0% {
                background-position: 0% 50%
            }

            50% {
                background-position: 100% 50%
            }

            100% {
                background-position: 0% 50%
            }
        }

        .avatar-inner {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: var(--bg2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Syne', sans-serif;
            font-size: 2rem;
            font-weight: 900;
            color: var(--text)
        }

        /* ── NAME ── */
        .name {
            font-family: 'Syne', sans-serif;
            font-weight: 900;
            font-size: 2.2rem;
            letter-spacing: -1.5px;
            background: linear-gradient(90deg, var(--a), var(--b), var(--c), var(--a));
            background-size: 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradSpin 4s linear infinite, fadeDown 0.7s 0.1s both
        }

        .role {
            margin-top: 5px;
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--sub);
            animation: fadeDown 0.7s 0.2s both
        }

        .tagline {
            margin-top: 8px;
            font-size: 0.92rem;
            color: var(--sub);
            text-align: center;
            max-width: 280px;
            line-height: 1.5;
            animation: fadeDown 0.7s 0.25s both
        }

        .divider {
            width: 36px;
            height: 3px;
            border-radius: 99px;
            background: linear-gradient(90deg, var(--a), var(--b));
            margin: 18px 0 24px;
            animation: fadeDown 0.7s 0.3s both;
            transition: background 0.4s
        }

        /* ── YOUTUBE WIDGET ── */
        .yt-widget {
            width: 100%;
            border-radius: 18px;
            overflow: hidden;
            background: var(--surface);
            border: 1px solid var(--border);
            backdrop-filter: blur(12px);
            margin-bottom: 14px;
            animation: fadeUp 0.6s 0.35s both;
            transition: border-color 0.2s, box-shadow 0.2s;
            text-decoration: none;
            color: inherit;
            display: block
        }

        .yt-widget:hover {
            border-color: rgba(255, 0, 0, 0.5);
            box-shadow: 0 8px 40px rgba(255, 0, 0, 0.15)
        }

        .yt-thumb-wrap {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            background: var(--bg2);
            overflow: hidden
        }

        .yt-thumb-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.4s ease
        }

        .yt-widget:hover .yt-thumb-wrap img {
            transform: scale(1.04)
        }

        .yt-play {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center
        }

        .yt-play-btn {
            width: 52px;
            height: 52px;
            background: rgba(255, 0, 0, 0.9);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, background 0.2s;
            backdrop-filter: blur(4px)
        }

        .yt-widget:hover .yt-play-btn {
            transform: scale(1.1);
            background: rgb(255, 0, 0)
        }

        .yt-play-btn svg {
            fill: white;
            width: 22px;
            height: 22px;
            margin-left: 3px
        }

        .yt-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(255, 0, 0, 0.9);
            color: white;
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            padding: 3px 9px;
            border-radius: 6px;
            text-transform: uppercase
        }

        .yt-info {
            padding: 12px 14px
        }

        .yt-label {
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: rgba(255, 60, 60, 0.8);
            margin-bottom: 4px
        }

        .yt-title {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            line-clamp: 2;
            /* ← add this */
            overflow: hidden;
        }

        .yt-loading {
            padding: 20px;
            text-align: center;
            color: var(--sub);
            font-size: 0.85rem
        }

        .yt-error {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 14px
        }

        /* ── LINK CARDS ── */
        .links {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px
        }

        .link-btn {
            position: relative;
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 15px 18px;
            border-radius: 16px;
            text-decoration: none;
            color: var(--text);
            font-weight: 600;
            font-size: 0.95rem;
            background: var(--surface);
            border: 1px solid var(--border);
            backdrop-filter: blur(12px);
            transition: border-color 0.2s, box-shadow 0.2s;
            overflow: hidden;
            animation: fadeUp 0.6s ease both;
            transform-style: preserve-3d;
            will-change: transform
        }

        .link-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: var(--grad);
            opacity: 0;
            transition: opacity 0.25s
        }

        .link-btn:hover::before {
            opacity: 0.08
        }

        .link-btn:hover {
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 12px 40px var(--shadow)
        }

        .icon-wrap {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--grad);
            flex-shrink: 0;
            position: relative;
            z-index: 1;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3)
        }

        .icon-wrap svg {
            width: 19px;
            height: 19px;
            fill: white
        }

        .link-text {
            position: relative;
            z-index: 1;
            flex: 1
        }

        .link-label {
            display: block;
            font-family: 'Syne', sans-serif;
            font-weight: 700;
            font-size: 0.97rem
        }

        .link-sub {
            display: block;
            font-size: 0.73rem;
            color: var(--sub);
            margin-top: 1px;
            font-weight: 400
        }

        .arrow {
            position: relative;
            z-index: 1;
            opacity: 0.3;
            transition: opacity 0.2s, transform 0.2s;
            flex-shrink: 0
        }

        .link-btn:hover .arrow {
            opacity: 1;
            transform: translateX(4px)
        }

        /* ── EMAIL COPY CARD ── */
        .email-card {
            width: 100%;
            border-radius: 16px;
            background: var(--surface);
            border: 1px solid var(--border);
            backdrop-filter: blur(12px);
            padding: 14px 18px;
            display: flex;
            align-items: center;
            gap: 14px;
            animation: fadeUp 0.6s ease both;
            cursor: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            position: relative;
            overflow: hidden
        }

        .email-card:hover {
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 30px var(--shadow)
        }

        .email-icon {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--a), var(--b));
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3)
        }

        .email-icon svg {
            width: 19px;
            height: 19px;
            fill: white
        }

        .email-text {
            flex: 1
        }

        .email-label {
            font-family: 'Syne', sans-serif;
            font-weight: 700;
            font-size: 0.97rem;
            color: var(--text)
        }

        .email-addr {
            font-size: 0.73rem;
            color: var(--sub);
            margin-top: 1px
        }

        .copy-btn {
            background: linear-gradient(135deg, var(--a), var(--b));
            border: none;
            color: white;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            padding: 6px 14px;
            border-radius: 8px;
            cursor: none;
            transition: transform 0.15s, opacity 0.15s;
            text-transform: uppercase;
            flex-shrink: 0
        }

        .copy-btn:hover {
            opacity: 0.85;
            transform: scale(1.05)
        }

        .copy-toast {
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, var(--a), var(--b));
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Syne', sans-serif;
            font-weight: 700;
            font-size: 0.9rem;
            color: white;
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
            border-radius: 16px
        }

        .copy-toast.show {
            opacity: 1
        }

        /* Individual colors */
        .btn-yt {
            --grad: linear-gradient(135deg, #FF0000, #FF5733)
        }

        .btn-x {
            --grad: linear-gradient(135deg, #1a1a1a, #555)
        }

        .btn-li {
            --grad: linear-gradient(135deg, #0077B5, #00A0DC)
        }

        .btn-web {
            --grad: linear-gradient(135deg, var(--a), var(--b))
        }

        .btn-blog {
            --grad: linear-gradient(135deg, #F5A623, #FF6B35)
        }

        /* Stagger */
        .links .link-btn:nth-child(1) {
            animation-delay: 0.45s
        }

        .links .link-btn:nth-child(2) {
            animation-delay: 0.52s
        }

        .links .link-btn:nth-child(3) {
            animation-delay: 0.59s
        }

        .links .link-btn:nth-child(4) {
            animation-delay: 0.66s
        }

        .links .link-btn:nth-child(5) {
            animation-delay: 0.73s
        }

        .email-card {
            animation-delay: 0.8s
        }

        @keyframes fadeDown {
            from {
                opacity: 0;
                transform: translateY(-18px)
            }

            to {
                opacity: 1;
                transform: translateY(0)
            }
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(22px)
            }

            to {
                opacity: 1;
                transform: translateY(0)
            }
        }

        .footer {
            margin-top: 36px;
            font-size: 0.72rem;
            color: var(--sub);
            text-align: center;
            opacity: 0.4;
            animation: fadeUp 0.6s 1s both
        }

        /* Mobile */
        @media(max-width:480px) {
            body {
                cursor: auto
            }

            #cursor,
            #cursor-ring,
            .trail {
                display: none
            }

            .theme-bar {
                top: 14px;
                right: 14px
            }

            .theme-btn {
                padding: 4px 9px;
                font-size: 0.62rem
            }
        }
    </style>
</head>

    <script>
        /* ── THEME ── */
        function setTheme(t) {
            document.documentElement.setAttribute('data-theme', t);
            document.querySelectorAll('.theme-btn').forEach(b => b.classList.toggle('active', b.dataset.t === t));
            localStorage.setItem('jj-theme', t);
        }
        (function () {
            const saved = localStorage.getItem('jj-theme') || 'neon';
            setTheme(saved);
        })();

        /* ── CURSOR ── */
        const cur = document.getElementById('cursor');
        const ring = document.getElementById('cursor-ring');
        let mx = 0, my = 0, rx = 0, ry = 0;
        document.addEventListener('mousemove', e => {
            mx = e.clientX; my = e.clientY;
            cur.style.left = mx + 'px'; cur.style.top = my + 'px';
        });
        (function animRing() {
            rx += (mx - rx) * 0.12;
            ry += (my - ry) * 0.12;
            ring.style.left = rx + 'px'; ring.style.top = ry + 'px';
            requestAnimationFrame(animRing);
        })();
        document.querySelectorAll('a,.link-btn,.email-card,.copy-btn,.theme-btn').forEach(el => {
            el.addEventListener('mouseenter', () => { cur.style.width = '22px'; cur.style.height = '22px'; ring.style.width = '50px'; ring.style.height = '50px'; ring.style.opacity = '0.7' });
            el.addEventListener('mouseleave', () => { cur.style.width = '12px'; cur.style.height = '12px'; ring.style.width = '36px'; ring.style.height = '36px'; ring.style.opacity = '0.5' });
        });

        /* ── CURSOR TRAIL ── */
        const TRAIL = 18; const trails = [];
        const colors = ['#ff2cf5', '#00ffe7', '#ffb800', '#ff6b35', '#4ecdc4'];
        for (let i = 0; i < TRAIL; i++) {
            const d = document.createElement('div');
            d.className = 'trail';
            const size = Math.max(2, 10 - (i * 0.5));
            d.style.cssText = `width:${size}px;height:${size}px;opacity:${(TRAIL - i) / TRAIL * 0.5};background:${colors[i % colors.length]}`;
            document.body.appendChild(d);
            trails.push({ el: d, x: 0, y: 0 });
        }
        const pts = Array(TRAIL).fill({ x: 0, y: 0 });
        document.addEventListener('mousemove', e => { pts.unshift({ x: e.clientX, y: e.clientY }); pts.pop() });
        (function animTrail() {
            trails.forEach((t, i) => {
                const p = pts[Math.min(i * 1.5 | 0, pts.length - 1)];
                t.el.style.left = p.x + 'px'; t.el.style.top = p.y + 'px';
            });
            requestAnimationFrame(animTrail);
        })();

        /* ── 3D TILT ── */
        document.querySelectorAll('.tilt-card').forEach(card => {
            card.addEventListener('mousemove', e => {
                const r = card.getBoundingClientRect();
                const x = e.clientX - r.left; const y = e.clientY - r.top;
                const cx = r.width / 2; const cy = r.height / 2;
                const rx2 = ((y - cy) / cy) * -8;
                const ry2 = ((x - cx) / cx) * 8;
                card.style.transform = `perspective(700px) rotateX(${rx2}deg) rotateY(${ry2}deg) scale(1.02)`;
                card.style.transition = 'transform 0.05s';
            });
            card.addEventListener('mouseleave', () => {
                card.style.transform = 'perspective(700px) rotateX(0) rotateY(0) scale(1)';
                card.style.transition = 'transform 0.4s ease';
            });
        });

        /* ── EMAIL COPY ── */
        function copyEmail(e) {
            if (e) e.stopPropagation();
            navigator.clipboard.writeText('hi@jaijain.in').then(() => {
                const t = document.getElementById('copy-toast');
                t.classList.add('show');
                setTimeout(() => t.classList.remove('show'), 1800);
            });
        }

        /* ── YOUTUBE LATEST VIDEO ── */
        (async function loadYT() {
            const channelHandle = 'decodewiithjai';
            const widget = document.getElementById('yt-widget');

            // Use YouTube RSS feed (no API key needed)
            const rssUrl = `https://www.youtube.com/feeds/videos.xml?channel_id=`;

            // Try to fetch channel ID via noembed / oEmbed trick then RSS
            // Fallback: show channel link card nicely
            try {
                // Fetch channel page to get channel ID
                const proxyUrl = `https://noembed.com/embed?url=https://www.youtube.com/@${channelHandle}`;
                const res = await fetch(proxyUrl);
                if (!res.ok) throw new Error();
                const data = await res.json();

                // Got channel info from noembed, show a nice card
                widget.innerHTML = `
      <div class="yt-thumb-wrap" style="background:linear-gradient(135deg,#1a0000,#330000);display:flex;align-items:center;justify-content:center;min-height:120px">
        <div style="text-align:center;padding:20px">
          <div style="font-size:2.5rem">▶️</div>
          <div style="font-family:'Syne',sans-serif;font-weight:800;font-size:1.1rem;color:white;margin-top:8px">${data.author_name || 'Decode With Jai'}</div>
        </div>
        <div class="yt-badge">YouTube</div>
      </div>
      <div class="yt-info">
        <div class="yt-label">🔴 Watch on YouTube</div>
        <div class="yt-title">Tap to visit the channel & watch latest videos →</div>
      </div>`;
                return;
            } catch (e) { }

            // Final fallback — static branded card
            widget.innerHTML = `
    <div class="yt-thumb-wrap" style="background:linear-gradient(135deg,#1a0000,#440000);display:flex;align-items:center;justify-content:center;padding:28px;gap:14px">
      <svg style="flex-shrink:0" width="48" height="48" viewBox="0 0 24 24" fill="#ff4444"><path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.5 12 3.5 12 3.5s-7.5 0-9.4.6a3 3 0 0 0-2.1 2.1C0 8.1 0 12 0 12s0 3.9.5 5.8a3 3 0 0 0 2.1 2.1c1.9.6 9.4.6 9.4.6s7.5 0 9.4-.6a3 3 0 0 0 2.1-2.1C24 15.9 24 12 24 12s0-3.9-.5-5.8zM9.8 15.5V8.5l6.3 3.5-6.3 3.5z"/></svg>
      <div>
        <div style="font-family:'Syne',sans-serif;font-weight:800;color:white;font-size:1rem">Decode With Jai</div>
        <div style="color:rgba(255,255,255,0.5);font-size:0.8rem;margin-top:3px">Growth & Marketing</div>
      </div>
      <div class="yt-badge">Live</div>
    </div>
    <div class="yt-info">
      <div class="yt-label">🔴 Latest Videos</div>
      <div class="yt-title">Tap to watch & subscribe on YouTube →</div>
    </div>`;
        })();
    </script>
